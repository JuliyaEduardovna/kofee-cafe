<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Kofee cafe</title>
</head>

<body>
    <div class="page-container">
        <header class="header-location">
            <p class="location-info">Tired ? Let’s have a cup of coffee.</p>

            <address class="location-info">
                <span>Call us: </span>
                <a class="location-info-phone" href="tel:123 456 789 241">123 456 789 241</a>
            </address>

            <p class="location-info">Our location: <span class="location-link" onclick="openMap()">Novosibirsk,
                    Russia</span></p>
        </header>

        <header class="header-navigation">
            <a class="header-logo-link" href="#"><img class="navigation-logo" src="images/logo.png" alt="logo" width="101"
                    height="36"></a>
            <nav class="navigation">

                <ul class="navigation-list">
                    <li class="navigation-item"><a href="#" class="navigation-link">Home</a></li>
                    <li class="navigation-item"><a href="#" class="navigation-link">About</a></li>
                    <li class="navigation-item"><a href="#" class="navigation-link">Services</a></li>
                    <li class="navigation-item"><a href="#" class="navigation-link">Blog</a></li>
                    <li class="navigation-item"><a href="#" class="navigation-link">Contact</a></li>
                </ul>
            </nav>
            <div class="header-search">
                <a class="navigation-link" href="#">
                    <span class="visually-hidden">Search</span>
                </a>
            </div>
        </header>
    </div>
    <div id="mapModal" class="map-modal">
        <div class="map-modal-content">
            <span class="map-close" onclick="closeMap()">&times;</span>
            <iframe id="mapFrame" src="about:blank" width="100%" height="500" frameborder="0"
                style="border-radius: 4px;" allowfullscreen>
            </iframe>
        </div>
    </div>
    <script src="scripts/main.js"></script>
</body>

</html>
